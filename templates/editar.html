
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar chamado - HelpDesk TI</title>

    <style>
        :root {
            --fundo: #f2f7f7;
            --branco: #ffffff;
            --azul-claro: #eaf3f8;
            --azul-medio: #d5e5f2;
            --azul-principal: #39758a;
            --azul-escuro: #28596b;
            --verde-claro: #e5f3ef;
            --verde-principal: #438b78;
            --texto: #334b52;
            --texto-suave: #71858a;
            --borda: #dce8e7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--fundo);
            color: var(--texto);
            margin: 0;
            padding: 35px 20px;
        }

        .container {
            background: var(--branco);
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--borda);
            box-shadow: 0 4px 15px rgba(48, 91, 98, 0.06);
        }

        .cabecalho {
            background: linear-gradient(120deg, #eaf3f8, #e5f3ef);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--azul-escuro);
            font-size: 23px;
            margin: 0 0 8px;
        }

        .subtitulo {
            color: var(--texto-suave);
            font-size: 13px;
            margin: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin: 17px 0 7px;
            color: var(--texto);
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--borda);
            border-radius: 7px;
            font-size: 14px;
            color: var(--texto);
            background: #ffffff;
            font-family: Arial, sans-serif;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #83b9b3;
            box-shadow: 0 0 0 3px rgba(131, 185, 179, 0.15);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .acoes {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            background: var(--azul-principal);
            color: #ffffff;
            border: none;
            border-radius: 7px;
            padding: 10px 17px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--azul-escuro);
        }

        .voltar {
            display: inline-block;
            background: var(--verde-claro);
            color: #347362;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }

        .voltar:hover {
            background: #cde8df;
        }

        .mensagem {
            padding: 11px 13px;
            border-radius: 7px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .mensagem.erro {
            background: #f8e8e8;
            color: #a64d55;
        }

        .mensagem.sucesso {
            background: var(--verde-claro);
            color: #347362;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 20px;
            }

            .acoes {
                align-items: stretch;
                flex-direction: column;
            }

            .acoes button,
            .acoes .voltar {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="cabecalho">
            <h1>Editar chamado #{{ chamado[0] }}</h1>
            <p class="subtitulo">Atualize as informações da solicitação técnica.</p>
        </div>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="mensagem {{ categoria }}">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>Solicitante</label>
            <input
                type="text"
                name="solicitante"
                value="{{ chamado[1] }}"
                required
            >

            <label>Título do chamado</label>
            <input
                type="text"
                name="titulo"
                value="{{ chamado[2] }}"
                required
            >

            <label>Descrição do problema</label>
            <textarea name="descricao" required>{{ chamado[3] }}</textarea>

            <label>Prioridade</label>
            <select name="prioridade" required>

                <option value="Baixa"
                    {% if chamado[4] == 'Baixa' %}selected{% endif %}>
                    Baixa
                </option>

                <option value="Média"
                    {% if chamado[4] == 'Média' or chamado[4] == 'Media' %}selected{% endif %}>
                    Média
                </option>

                <option value="Alta"
                    {% if chamado[4] == 'Alta' %}selected{% endif %}>
                    Alta
                </option>

            </select>

            <div class="acoes">
                <button type="submit">Salvar alterações</button>
                <a href="/" class="voltar">Voltar ao painel</a>
            </div>

        </form>

    </div>

</body>
</html>
