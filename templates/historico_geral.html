
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico Geral | HelpDesk TI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            margin: 0;
            padding: 30px;
            color: #263238;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .registro {
            border-left: 5px solid #1d3557;
            padding: 15px;
            margin: 15px 0;
            background: #f8fafc;
        }

        .registro h3 {
            margin-top: 0;
        }

        .cadastro {
            border-color: #15803d;
        }

        .edicao {
            border-color: #2563eb;
        }

        .exclusao {
            border-color: #b91c1c;
        }

        .alteracao {
            border-color: #d97706;
        }

        .data {
            color: #777;
            font-size: 13px;
        }

        .botao {
            display: inline-block;
            background: #1d3557;
            color: white;
            padding: 12px 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
        }

        .filtros {
    display: grid;
    grid-template-columns: 1fr 220px 120px;
    gap: 10px;
    margin: 20px 0;
}

input, select, button {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

button {
    background: #1d3557;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #294b78;
}

.limpar {
    display: inline-block;
    color: #1d3557;
    margin-bottom: 15px;
}

@media (max-width: 600px) {
    .filtros {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>

<body>

    <div class="container">

        <h1>Histórico geral</h1>

        <p>Registro de atividades realizadas no HelpDesk TI.</p>

        <hr>

        <h2>Atividades registradas</h2>

        <form action="/historico-geral" method="GET" class="filtros">

    <input
        type="text"
        name="busca"
        placeholder="Pesquisar chamado ou atividade..."
        value="{{ busca }}"
    >

    <select name="acao">

        <option value="">Todas as atividades</option>

        <option value="Cadastro"
        {% if acao_selecionada == 'Cadastro' %}selected{% endif %}>
            Cadastro
        </option>

        <option value="Edição"
        {% if acao_selecionada == 'Edição' %}selected{% endif %}>
            Edição
        </option>

        <option value="Alteração de status"
        {% if acao_selecionada == 'Alteração de status' %}selected{% endif %}>
            Alteração de status
        </option>

        <option value="Exclusão"
        {% if acao_selecionada == 'Exclusão' %}selected{% endif %}>
            Exclusão
        </option>

    </select>

    <button type="submit">Filtrar</button>

</form>

<a href="/historico-geral" class="limpar">Limpar filtros</a>

        {% for registro in registros %}

            <div class="registro
                {% if registro[2] == 'Cadastro' %}cadastro
                {% elif registro[2] == 'Edição' %}edicao
                {% elif registro[2] == 'Exclusão' %}exclusao
                {% elif registro[2] == 'Alteração de status' %}alteracao
                {% endif %}">

                <h3>{{ registro[2] }}</h3>

                <p>
                    <b>Chamado:</b> #{{ registro[1] }}
                </p>

                <p>{{ registro[3] }}</p>

                <span class="data">
                    {{ registro[4] }}
                </span>

            </div>

        {% else %}

            <p>Nenhuma atividade registrada.</p>

        {% endfor %}

        <a href="/" class="botao">Voltar ao painel</a>

    </div>

</body>
</html>
